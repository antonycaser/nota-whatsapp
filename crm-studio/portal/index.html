<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!--
    PORTAL DO CRM — Lara Altoé Makeup & Beauty
    Esta página abre o CRM em tela cheia, SEM a faixa
    "Este aplicativo foi criado por um usuário do Google Apps Script",
    e permite instalar como aplicativo no celular (com a sua logo).

    ⚠️ ÚNICA COISA PARA ALTERAR: cole o link do seu app (termina em /exec)
       na linha  var LINK_DO_APP = '...'  logo abaixo, no <script>.
  -->
  <script>
    var LINK_DO_APP = 'COLE_AQUI_O_LINK_QUE_TERMINA_EM_/exec';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lara Altoé · CRM</title>
  <meta name="theme-color" content="#f8f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lara Altoé">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg: #f8f5f2; --accent: #085c5c; --text: #1c2626; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1616; --text: #ecf2f1; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: var(--bg); transition: opacity .35s; }
    .splash img { width: 132px; height: 132px; border-radius: 30px; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(8, 92, 92, .18); border-top-color: var(--accent); animation: g .8s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
    .aviso { max-width: 360px; padding: 0 24px; text-align: center; font-size: 15px; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img src="icon-512.png" alt="Lara Altoé Makeup & Beauty">
    <div class="spin" id="spin"></div>
    <div class="aviso hidden" id="aviso">
      Falta configurar o link do app.<br>Abra este arquivo <b>index.html</b> e cole o link que termina em <b>/exec</b> na linha <code>LINK_DO_APP</code>.
    </div>
  </div>
  <script>
    (function () {
      var ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(LINK_DO_APP);
      if (!ok) {
        document.getElementById('spin').className = 'hidden';
        document.getElementById('aviso').className = 'aviso';
        return;
      }
      var f = document.createElement('iframe');
      f.src = LINK_DO_APP;
      f.title = 'CRM Lara Altoé';
      f.allow = 'clipboard-write';
      f.onload = function () {
        var s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 400);
      };
      document.body.appendChild(f);
    })();
  </script>
</body>
</html>
