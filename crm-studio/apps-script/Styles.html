<style>
:root {
  color-scheme: light;
  --bg: #faf6f4;
  --surface: #ffffff;
  --surface-2: #f6efec;
  --surface-3: #efe6e2;
  --border: #ece2de;
  --text: #241b26;
  --text-2: #5d505b;
  --muted: #8a7c87;
  --accent: #b8336a;
  --accent-hover: #9f2a5b;
  --accent-soft: #fbe9f0;
  --accent-ink: #ffffff;
  --sidebar: #231a25;
  --sidebar-2: #2f2431;
  --sidebar-text: #e9dfe7;
  --sidebar-muted: #a593a3;
  --good: #1f8a4c;   --good-soft: #e3f4ea;
  --warn: #b66a00;   --warn-soft: #fdf0dc;
  --bad: #c7363c;    --bad-soft: #fbe5e5;
  --info: #2a67c4;   --info-soft: #e5eefb;
  --violet: #6a4ce2; --violet-soft: #ece8fc;
  --s1: #c2457a; --s2: #257de0; --s3: #f2a600; --s4: #6a4ce2; --s5: #00b894; --s6: #f47230;
  --grid: #efe7e4;
  --shadow: 0 1px 2px rgba(36, 27, 38, .04), 0 4px 16px rgba(36, 27, 38, .06);
  --shadow-lg: 0 10px 40px rgba(36, 27, 38, .18);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141015; --surface: #1d171e; --surface-2: #261e27; --surface-3: #2f2630; --border: #352b37;
    --text: #f3ecf1; --text-2: #cdbfca; --muted: #a596a2;
    --accent: #e0679a; --accent-hover: #ea83ad; --accent-soft: #3a2230; --accent-ink: #1a0f15;
    --sidebar: #100c11; --sidebar-2: #1d161e;
    --good: #4cc47e; --good-soft: #17301f; --warn: #e5a441; --warn-soft: #33270f;
    --bad: #f0767a; --bad-soft: #3a1b1d; --info: #6aa6f5; --info-soft: #172840;
    --violet: #9887ef; --violet-soft: #251f42;
    --s1: #e0679a; --s2: #338ced; --s3: #d28e05; --s4: #9887ef; --s5: #00a888; --s6: #e76624;
    --grid: #2c242d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141015; --surface: #1d171e; --surface-2: #261e27; --surface-3: #2f2630; --border: #352b37;
  --text: #f3ecf1; --text-2: #cdbfca; --muted: #a596a2;
  --accent: #e0679a; --accent-hover: #ea83ad; --accent-soft: #3a2230; --accent-ink: #1a0f15;
  --sidebar: #100c11; --sidebar-2: #1d161e;
  --good: #4cc47e; --good-soft: #17301f; --warn: #e5a441; --warn-soft: #33270f;
  --bad: #f0767a; --bad-soft: #3a1b1d; --info: #6aa6f5; --info-soft: #172840;
  --violet: #9887ef; --violet-soft: #251f42;
  --s1: #e0679a; --s2: #338ced; --s3: #d28e05; --s4: #9887ef; --s5: #00a888; --s6: #e76624;
  --grid: #2c242d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* ---------- ícones ---------- */
.ico { display: inline-flex; width: 18px; height: 18px; flex: none; }
.ico svg { width: 100%; height: 100%; }

/* ---------- botões ---------- */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, transform .05s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad-soft); }
.btn.wa { background: #25d366; border-color: #25d366; color: #06301a; }
.btn.wa:hover { background: #1fbe5b; }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 10px; }
.btn.lg { height: 48px; font-size: 15px; }
.btn.block { width: 100%; }
.icon-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.sm { width: 30px; height: 30px; }
.icon-btn.sm .ico { width: 16px; height: 16px; }

/* ---------- formulários ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.field small { color: var(--muted); font-size: 12px; }
input[type=text], input[type=password], input[type=tel], input[type=email], input[type=number], input[type=date],
input[type=time], input[type=month], input:not([type]), select, textarea {
  width: 100%; height: 42px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
.form-error { background: var(--bad-soft); color: var(--bad); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; margin-bottom: 12px; }
.switch input { appearance: none; width: 40px; height: 24px; border-radius: 99px; background: var(--surface-3);
  position: relative; cursor: pointer; flex: none; border: 0; transition: background .15s; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }
.pass-wrap { position: relative; }
.pass-eye { position: absolute; right: 6px; top: 6px; height: 30px; width: 34px; border: 0; background: transparent; cursor: pointer; opacity: .6; }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
.login-art { background: radial-gradient(1200px 600px at 10% 10%, #5a2a48 0%, transparent 60%),
  radial-gradient(900px 500px at 90% 90%, #8a2f5e 0%, transparent 55%), #1d1420; color: #f6eaf1;
  display: flex; align-items: center; padding: 64px; position: relative; overflow: hidden; }
.login-art::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 22px 22px; pointer-events: none; }
.login-art-inner { position: relative; z-index: 1; max-width: 460px; }
.login-art h2 { font-family: var(--font-display); font-weight: 500; font-size: 42px; line-height: 1.1; margin: 22px 0 16px; letter-spacing: -.01em; }
.login-art p { color: #d9c4d2; font-size: 16px; }
.login-points { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 10px; }
.login-points li { padding-left: 26px; position: relative; color: #f0dfe9; }
.login-points li::before { content: '✦'; position: absolute; left: 0; color: #f19ac0; }
.login-box { display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
.login-card { width: 100%; max-width: 380px; }
.login-card h1 { font-family: var(--font-display); font-weight: 500; font-size: 30px; margin: 28px 0 4px; }
.login-card > p { margin: 0 0 24px; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 20px 14px; display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #e0679a, #9b3fb8); color: #fff; font-size: 16px; flex: none; box-shadow: 0 4px 14px rgba(224,103,154,.35); }
.brand-mark.big { width: 56px; height: 56px; font-size: 26px; border-radius: 16px; }
.brand-name { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
.login-card .brand { padding: 0; }
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--sidebar-muted); padding: 16px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; color: var(--sidebar-text);
  background: transparent; border: 0; cursor: pointer; text-align: left; width: 100%; font-weight: 500; opacity: .82; }
.nav-item:hover { background: var(--sidebar-2); opacity: 1; }
.nav-item.active { background: linear-gradient(90deg, rgba(224,103,154,.22), rgba(224,103,154,.06)); opacity: 1; color: #fff; }
.nav-item.active .ico { color: #f19ac0; }
.nav-badge { margin-left: auto; background: #e0679a; color: #1b0d14; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
.sidebar-foot { border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px; margin-top: 10px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 18px 28px; position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.topbar-title { flex: 1; min-width: 0; }
.topbar-title h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
.topbar-title p { margin: 2px 0 0; font-size: 13px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.search-global { position: relative; display: flex; align-items: center; }
.search-global .ico { position: absolute; left: 12px; color: var(--muted); width: 16px; height: 16px; pointer-events: none; }
.search-global input { width: 240px; padding-left: 36px; background: var(--surface); }
.dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 50; max-height: 320px; overflow: auto; padding: 6px; min-width: 260px; }
.dropdown-item { padding: 9px 10px; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.dropdown-item:hover, .dropdown-item.sel { background: var(--surface-2); }
.page { padding: 4px 28px 40px; max-width: 1400px; width: 100%; }
.scrim { display: none; }
.bottom-nav { display: none; }
.only-mobile { display: none; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 0; flex-wrap: wrap; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
.card-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-body { padding: 16px 20px 20px; }
.grid { display: grid; gap: 18px; align-items: start; }
.cols-12 { grid-template-columns: repeat(12, 1fr); }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 16px 18px; }
.kpi-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi-label .ico { width: 16px; height: 16px; }
.kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi-foot { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kpi.hero { background: linear-gradient(135deg, #2a1b2c, #5b2547 60%, #9c3366); color: #fff; border: 0; }
.kpi.hero .kpi-label, .kpi.hero .kpi-foot { color: rgba(255,255,255,.75); }
.trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 99px; }
.trend.up { background: var(--good-soft); color: var(--good); }
.trend.down { background: var(--bad-soft); color: var(--bad); }
.kpi.hero .trend.up { background: rgba(76,196,126,.2); color: #8ff0b6; }
.kpi.hero .trend.down { background: rgba(240,118,122,.2); color: #ffb0b3; }

/* ---------- pills / status ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-agendado { background: var(--info-soft); color: var(--info); }
.st-confirmado { background: var(--good-soft); color: var(--good); }
.st-concluido { background: var(--violet-soft); color: var(--violet); }
.st-faltou { background: var(--warn-soft); color: var(--warn); }
.st-cancelado { background: var(--surface-3); color: var(--muted); }
.st-remarcar { background: var(--accent-soft); color: var(--accent); }
.st-pago { background: var(--good-soft); color: var(--good); }
.st-pendente { background: var(--warn-soft); color: var(--warn); }
.st-atrasado { background: var(--bad-soft); color: var(--bad); }
.st-enviada { background: var(--good-soft); color: var(--good); }
.st-erro { background: var(--bad-soft); color: var(--bad); }
.st-recebida { background: var(--info-soft); color: var(--info); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 7px; background: var(--surface-2);
  color: var(--text-2); font-size: 11.5px; font-weight: 600; margin: 0 4px 4px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- listas / tabelas ---------- */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time-box { width: 56px; text-align: center; flex: none; }
.time-box b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.time-box span { font-size: 11.5px; color: var(--muted); }
.ag-bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.desc { min-width: 220px; }
.tbl tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: 0; }
.bar-cell { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty .big { font-size: 30px; margin-bottom: 6px; }

/* ---------- toolbar / tabs ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--text-2); font-size: 13px; }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.month-nav { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
.month-nav span { min-width: 130px; text-align: center; font-weight: 700; text-transform: capitalize; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px;
  padding: 8px 12px; cursor: pointer; font-size: 13px; text-align: left; transition: border-color .15s, background .15s; }
.chip:hover { border-color: var(--accent); }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.chip .chip-sub { color: var(--muted); font-size: 12px; }
.var-chip { font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); border: 0; cursor: pointer; color: var(--text-2); }
.var-chip:hover { background: var(--accent-soft); color: var(--accent); }

/* ---------- modal / drawer ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20, 12, 20, .45); z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fade .15s ease-out; backdrop-filter: blur(2px); }
.modal { background: var(--surface); border-radius: 20px; width: 100%; max-width: 560px; max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); animation: pop .18s ease-out; }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }
.overlay.drawer { justify-content: flex-end; padding: 0; align-items: stretch; }
.overlay.drawer .modal-body { flex: 1; }
.overlay.drawer .modal { max-width: 520px; border-radius: 20px 0 0 20px; max-height: 100vh; height: 100vh; animation: slide .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin: 18px 0 10px; }
.section-title:first-child { margin-top: 0; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-grid .k { font-size: 12px; color: var(--muted); }
.info-grid .v { font-weight: 600; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-mini { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat-mini b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat-mini span { font-size: 12px; color: var(--muted); }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; }
